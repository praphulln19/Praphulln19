name: Update GitHub Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch streak SVG
        run: |
          if [ -f assets/streak.svg ]; then
            cp assets/streak.svg /tmp/streak.svg
          fi
          curl -s "https://github-readme-streak-stats-eight.vercel.app/?user=praphulln19&theme=dark&hide_border=false" -o assets/streak.svg
          if ! head -1 assets/streak.svg | grep -q "<svg"; then
            if [ -f /tmp/streak.svg ]; then
              mv /tmp/streak.svg assets/streak.svg
            else
              printf '<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195"><text x="16" y="30" font-size="20" fill="#c9d1d9">streak stats unavailable</text></svg>\n' > assets/streak.svg
            fi
          fi

      - name: Generate private-aware stats SVGs
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const username = 'praphulln19';
          const token = process.env.PROFILE_STATS_TOKEN;
          const headers = {
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': `${username}-profile-readme`
          };

          if (token) {
            headers.Authorization = `Bearer ${token}`;
          }

          const colors = {
            JavaScript: '#f1e05a',
            TypeScript: '#3178c6',
            Python: '#3572A5',
            CSS: '#663399',
            HTML: '#e34c26',
            Java: '#b07219',
            C: '#555555',
            'C++': '#f34b7d',
            'Jupyter Notebook': '#DA5B0B',
            Markdown: '#083fa1'
          };

          const hiddenLanguages = new Set(['Dart']);

          const escapeHtml = (value) => String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');

          const request = async (url, options = {}) => {
            const response = await fetch(url, { ...options, headers: { ...headers, ...(options.headers || {}) } });
            if (!response.ok) {
              throw new Error(`${response.status} ${response.statusText}: ${await response.text()}`);
            }
            return response.json();
          };

          const getAllPages = async (url) => {
            const results = [];
            let page = 1;
            while (page <= 10) {
              const separator = url.includes('?') ? '&' : '?';
              const batch = await request(`${url}${separator}per_page=100&page=${page}`);
              if (!Array.isArray(batch) || batch.length === 0) break;
              results.push(...batch);
              if (batch.length < 100) break;
              page += 1;
            }
            return results;
          };

          const writeStatsFallback = (message) => {
            fs.writeFileSync('assets/github-stats.svg', `<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195">
              <rect x="0.5" y="0.5" width="494" height="194" rx="4.5" fill="#151515" stroke="#E4E2E2"/>
              <text x="24" y="40" fill="#58a6ff" font-family="Segoe UI, Ubuntu, sans-serif" font-size="20" font-weight="700">Praphull Kumar's GitHub Stats</text>
              <text x="24" y="84" fill="#f0f6fc" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14">${escapeHtml(message)}</text>
            </svg>\n`);
          };

          const writeLangFallback = (message) => {
            fs.writeFileSync('assets/top-langs.svg', `<svg xmlns="http://www.w3.org/2000/svg" width="480" height="142" viewBox="0 0 480 142">
              <rect x="0.5" y="0.5" width="479" height="141" rx="4.5" fill="#151515" stroke="#E4E2E2"/>
              <text x="24" y="40" fill="#58a6ff" font-family="Segoe UI, Ubuntu, sans-serif" font-size="18" font-weight="700">Most Used Languages</text>
              <text x="24" y="80" fill="#f0f6fc" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14">${escapeHtml(message)}</text>
            </svg>\n`);
          };

          (async () => {
          if (!token) {
            writeStatsFallback('Add PROFILE_STATS_TOKEN to include private contributions.');
            writeLangFallback('Add PROFILE_STATS_TOKEN to include private repositories.');
            process.exit(0);
          }

          const graphql = await request('https://api.github.com/graphql', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              query: `query($login: String!) {
                user(login: $login) {
                  name
                  followers { totalCount }
                  repositories(privacy: PUBLIC, first: 1) { totalCount }
                  contributionsCollection {
                    contributionCalendar { totalContributions }
                    totalCommitContributions
                    restrictedContributionsCount
                  }
                }
              }`,
              variables: { login: username }
            })
          });

          const user = graphql.data.user;
          const contributions = user.contributionsCollection;
          const totalContributions = contributions.contributionCalendar.totalContributions;
          const commitContributions = contributions.totalCommitContributions;
          const privateContributions = contributions.restrictedContributionsCount;

          fs.writeFileSync('assets/github-stats.svg', `<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195">
            <rect x="0.5" y="0.5" width="494" height="194" rx="4.5" fill="#151515" stroke="#E4E2E2"/>
            <text x="24" y="38" fill="#58a6ff" font-family="Segoe UI, Ubuntu, sans-serif" font-size="20" font-weight="700">${escapeHtml(user.name || 'Praphull Kumar')}'s GitHub Stats</text>
            <text x="24" y="76" fill="#f0f6fc" font-family="Segoe UI, Ubuntu, sans-serif" font-size="28" font-weight="700">${totalContributions}</text>
            <text x="24" y="100" fill="#9E9E9E" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13">Contributions this year, including private activity visible to your token</text>
            <text x="24" y="137" fill="#f0f6fc" font-family="Segoe UI, Ubuntu, sans-serif" font-size="15">Commits: ${commitContributions}</text>
            <text x="185" y="137" fill="#f0f6fc" font-family="Segoe UI, Ubuntu, sans-serif" font-size="15">Private: ${privateContributions}</text>
            <text x="330" y="137" fill="#f0f6fc" font-family="Segoe UI, Ubuntu, sans-serif" font-size="15">Public repos: ${user.repositories.totalCount}</text>
            <text x="24" y="166" fill="#f0f6fc" font-family="Segoe UI, Ubuntu, sans-serif" font-size="15">Followers: ${user.followers.totalCount}</text>
          </svg>\n`);

          const repos = await getAllPages('https://api.github.com/user/repos?visibility=all&affiliation=owner');
          const languageTotals = new Map();

          for (const repo of repos.filter((repo) => !repo.fork && !repo.archived)) {
            const languages = await request(repo.languages_url);
            for (const [language, bytes] of Object.entries(languages)) {
              if (hiddenLanguages.has(language)) continue;
              languageTotals.set(language, (languageTotals.get(language) || 0) + bytes);
            }
          }

          const entries = [...languageTotals.entries()]
            .filter(([, bytes]) => bytes > 0)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 6);

          if (entries.length === 0) {
            writeLangFallback('No language data found for owned repositories.');
            process.exit(0);
          }

          const totalBytes = entries.reduce((sum, [, bytes]) => sum + bytes, 0);
          let offset = 0;
          const bar = entries.map(([language, bytes]) => {
            const width = Math.max(1, (bytes / totalBytes) * 432);
            const x = offset;
            offset += width;
            return `<rect x="${x.toFixed(2)}" y="0" width="${width.toFixed(2)}" height="8" fill="${colors[language] || '#8b949e'}"/>`;
          }).join('');

          const rows = entries.map(([language, bytes], index) => {
            const percent = ((bytes / totalBytes) * 100).toFixed(1);
            const x = index % 2 === 0 ? 24 : 252;
            const y = 78 + Math.floor(index / 2) * 24;
            return `<circle cx="${x}" cy="${y - 4}" r="5" fill="${colors[language] || '#8b949e'}"/>
              <text x="${x + 14}" y="${y}" fill="#f0f6fc" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13">${escapeHtml(language)}</text>
              <text x="${x + 150}" y="${y}" fill="#9E9E9E" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12">${percent}%</text>`;
          }).join('');

          fs.writeFileSync('assets/top-langs.svg', `<svg xmlns="http://www.w3.org/2000/svg" width="480" height="142" viewBox="0 0 480 142">
            <rect x="0.5" y="0.5" width="479" height="141" rx="4.5" fill="#151515" stroke="#E4E2E2"/>
            <text x="24" y="32" fill="#58a6ff" font-family="Segoe UI, Ubuntu, sans-serif" font-size="18" font-weight="700">Most Used Languages</text>
            <g transform="translate(24 46)">${bar}</g>
            ${rows}
          </svg>\n`);
          })().catch((error) => {
            console.error(error);
            writeStatsFallback('Stats update failed. Check the workflow logs.');
            writeLangFallback('Language update failed. Check the workflow logs.');
          });
          NODE

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- assets/streak.svg assets/top-langs.svg assets/github-stats.svg; then
            echo "No SVG updates detected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg assets/top-langs.svg assets/github-stats.svg
          git commit -m "chore: update GitHub stats SVGs"
          git push
